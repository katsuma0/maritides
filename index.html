<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maritime Tides</title>
<meta name="description" content="Live tide times for New Brunswick, Nova Scotia and PEI. Works offline.">
<meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tides">
<link rel="stylesheet" href="app.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <label class="station-picker">
      <span class="visually-hidden">Location</span>
      <select id="station"></select>
    </label>
    <p class="clock" id="clock">&nbsp;</p>
  </div>
</header>

<main id="main" hidden>

  <!-- ── Right now ─────────────────────────────────────────────── -->
  <section class="card hero" aria-labelledby="hero-heading">
    <h2 id="hero-heading" class="visually-hidden">Right now</h2>

    <div class="hero-state">
      <span class="dir-badge" id="dir-badge" aria-hidden="true"></span>
      <p class="dir-word" id="dir-word">&nbsp;</p>
    </div>

    <p class="countdown-label" id="countdown-label">&nbsp;</p>
    <p class="countdown" id="countdown">&nbsp;</p>
    <p class="countdown-detail" id="countdown-detail">&nbsp;</p>

    <div class="meter" role="img" id="meter-fig" aria-label="">
      <div class="meter-track"><div class="meter-fill" id="meter-fill"></div></div>
      <div class="meter-ends">
        <span id="meter-from">&nbsp;</span>
        <span id="meter-to">&nbsp;</span>
      </div>
    </div>

    <dl class="facts">
      <div><dt>Now</dt><dd id="fact-now">&nbsp;</dd></div>
      <div><dt>Next high</dt><dd id="fact-high">&nbsp;</dd></div>
      <div><dt>Next low</dt><dd id="fact-low">&nbsp;</dd></div>
    </dl>
  </section>

  <!-- ── The curve ─────────────────────────────────────────────── -->
  <section class="card chart-card" aria-labelledby="chart-heading">
    <div class="card-head">
      <h2 id="chart-heading">Next 30 hours</h2>
      <p class="card-sub" id="chart-sub">&nbsp;</p>
    </div>
    <div class="chart-wrap" id="chart-wrap">
      <svg id="chart" role="img" aria-labelledby="chart-heading chart-desc"></svg>
      <p id="chart-desc" class="visually-hidden"></p>
      <div class="tooltip" id="tooltip" hidden></div>
    </div>
  </section>

  <!-- ── The month ─────────────────────────────────────────────── -->
  <section class="card" aria-labelledby="days-heading">
    <div class="card-head">
      <h2 id="days-heading">Next 31 days</h2>
      <p class="card-sub" id="days-sub">&nbsp;</p>
    </div>
    <div id="days"></div>
  </section>

  <footer class="foot">
    <p id="foot-station">&nbsp;</p>
    <p>Atlantic Time. Heights in metres above chart datum.
       Predictions only — wind and pressure move real water. Not for navigation.</p>
    <p class="offline-hint" id="offline-hint">On iPhone: Share → Add to Home Screen.</p>
    <p><a href="https://katsuma.ca/">katsuma.ca</a></p>
  </footer>
</main>

<p id="fallback" class="fallback">Loading tides…</p>

<script src="tide-data.js"></script>
<script src="app.js"></script>
</body>
</html>
